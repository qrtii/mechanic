<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مقارنة التقرير | كراج الميكانيكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body {
      min-height: 100%;
    }

    .compare-page-shell {
      width: min(1600px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0;
    }

    .compare-full-card {
      padding: 14px;
      margin-top: 22px;
    }

    .compare-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .compare-toolbar h1 {
      font-size: 1.5rem;
      margin: 0;
      color: #ffe5a2;
    }

    .compare-open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 14px;
      text-decoration: none;
      color: #111827;
      background: linear-gradient(135deg, #ffe4a2, var(--accent));
      font-weight: 800;
    }

    .compare-frame-full {
      width: 100%;
      height: calc(100vh - 150px);
      min-height: 720px;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      background: #05070b;
    }

    .compare-frame-full iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #05070b;
    }

    @media (max-width: 720px) {
      .compare-page-shell {
        width: min(100% - 18px, 1600px);
        padding: 14px 0;
      }

      .compare-frame-full {
        height: calc(100vh - 190px);
        min-height: 620px;
      }
    }
  </style>
</head>
<body>
  <main class="compare-page-shell">
    <nav class="top-nav card" aria-label="التنقل بين صفحات الموقع">
      <a href="index.html">توجيهات الميدان</a>
      <a href="reports.html">التقارير الميدانية</a>
      <a href="supervision.html">تقارير الاشراف</a>
      <a href="admin.html">شؤون إدارية</a>
      <a class="active" href="compare-report.html">مقارنة التقرير</a>
    </nav>

    <section class="card compare-full-card">
      <div class="compare-toolbar">
        <h1>مقارنة التقرير</h1>
        <a class="compare-open-link" href="https://xhhp1.github.io/SOMTINGHNEW/" target="_blank" rel="noopener">فتح في صفحة مستقلة</a>
      </div>

      <div class="compare-frame-full">
        <iframe
          src="https://xhhp1.github.io/SOMTINGHNEW/"
          title="مقارنة التقرير"
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen>
        </iframe>
      </div>
    </section>
  </main>
</body>
</html>
